[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "afa_ssl"
version = "0.1.0"
description = "Self-supervised pretraining of the predictor for label-efficient active feature acquisition"
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "pandas", "scikit-learn", "torch", "pyyaml", "psutil",
  "matplotlib", "seaborn", "statsmodels",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
